apiVersion: networking.k8s.io/v1
kind: Ingress # type d'objet (Deployment, Service, Ingress)
metadata:
  name: app-ingress
spec:
  ingressClassName: traefik # Indique qui doit lire les regles (traefik par default mais ca pourrait etre nginx ou autre)
  rules:
  - http: # BLoc avec les regles de routage HTTP
      paths:
      - pathType: Prefix
        path: "/" # Gestion des path, on pourrait avoir / et /api avec une gestion differente mais ici avec Prefix et "/" tout fonctionne app1.com/test ou app1.com/lol
        backend: # Destination vers laquelle traefik transmet la requete.
          service:
            name: app-service # Service cible
            port:
              number: 80 # Port du service cible

---
#Deployement dev

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: wil42/playground:v2
        ports:
        - containerPort: 8888

---

# Service dev

apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  selector:
    app: app # label des pods gerer par ce service
  ports:
    - protocol: TCP
      port: 80 # Port de communication expose par le service pour que l'Ingresse lui parle
      targetPort: 8888 # Port sur lequel ecoute le conteneur dans le pod

